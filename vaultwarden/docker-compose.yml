services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file: .env
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED}
      - ROCKET_ADDR=0.0.0.0
      - ROCKET_PORT=8080
      - WEBSOCKET_ENABLED=true
      - DOMAIN=${DOMAIN}
    volumes:
      - ./vw-data:/data
    ports:
      - "127.0.0.1:8080:8080"   # bound to localhost only — reachable exclusively through the reverse proxy
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
